[project]
name = "hermes-penelopa"
version = "0.1.0"
description = "Isolated Penelopa lifecycle adapter for the genuine NousResearch Hermes runtime"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
